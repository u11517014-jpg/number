<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>四位數幾 A 幾 B - 版本三 (雲端存檔)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- 1. 代號登入區 -->
    <div id="loginCard" class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
      <h1 class="text-xl font-bold text-slate-800 mb-2">四位數幾 A 幾 B <span class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full font-semibold">my-v3 雲端版</span></h1>
      <p class="text-sm text-slate-500 mb-4">輸入玩家代號以讀取或建立雲端紀錄（無需密碼）。</p>
      <div class="flex gap-3">
        <input type="text" id="userIdInput" placeholder="請輸入代號（例：player01）" class="flex-1 px-4 py-2 border rounded-lg font-mono outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="loginUser()" id="loginBtn" class="px-6 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700">進入遊戲</button>
      </div>
    </div>

    <!-- 2. 主遊戲區 (登入後顯示) -->
    <div id="gameContainer" class="hidden space-y-6">
      <header class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
        <div class="flex flex-wrap items-center justify-between gap-4 border-b pb-4 mb-4">
          <div>
            <span class="text-xs text-slate-400">目前玩家代號</span>
            <h2 id="currentUserIdDisplay" class="text-xl font-bold text-slate-800 font-mono">--</h2>
          </div>
          <div class="flex items-center gap-4">
            <label class="flex items-center gap-2 text-sm bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-200 cursor-pointer">
              <input type="checkbox" id="debugToggle" onchange="toggleDebugMode()" class="rounded text-amber-600">
              <span class="font-medium text-amber-800">除錯模式</span>
            </label>
            <button onclick="logoutUser()" class="text-xs text-slate-500 hover:text-slate-800 underline">切換代號</button>
          </div>
        </div>

        <!-- 除錯顯示區域 -->
        <div id="debugPanel" class="hidden bg-amber-100 border border-amber-300 text-amber-900 px-4 py-2 rounded-lg text-sm mb-4">
          🔍 雲端儲存真實答案：<strong id="debugAnswer" class="font-mono text-lg text-amber-700 tracking-wider">----</strong>
        </div>

        <div class="flex items-center justify-between">
          <button onclick="handleCreateNewGame()" id="newGameBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow-sm">
            ＋ 開新局（保留舊局）
          </button>
          <span id="saveStatus" class="text-xs font-semibold text-emerald-600">已連線雲端</span>
        </div>
      </header>

      <!-- 作答區 -->
      <main class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h3 id="currentTurnTitle" class="text-lg font-bold text-slate-800">未選取遊戲</h3>
          <span id="turnStatusBadge" class="text-xs px-2.5 py-1 rounded-full font-semibold bg-slate-100 text-slate-600">請開局或選取舊局</span>
        </div>

        <form id="guessForm" onsubmit="handleGuessSubmit(event)" class="flex gap-3">
          <input type="text" id="guessInput" maxlength="4" placeholder="輸入 4 個不重複數字 (如 0123)" disabled class="flex-1 px-4 py-2.5 bg-slate-50 border rounded-lg font-mono text-lg tracking-widest outline-none focus:ring-2 focus:ring-indigo-500 disabled:bg-slate-100">
          <button type="submit" id="submitBtn" disabled class="px-6 py-2.5 bg-slate-800 text-white font-medium rounded-lg hover:bg-slate-900 disabled:bg-slate-300">送出猜測並儲存</button>
        </form>

        <div id="alertBox" class="hidden mt-3 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg"></div>
      </main>

      <!-- 歷史紀錄 -->
      <section class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
        <h3 class="text-lg font-bold text-slate-800 mb-4">雲端多局歷史紀錄</h3>
        <div id="historyContainer" class="space-y-4"></div>
      </section>
    </div>

  </div>

  <script>
    let currentUserId = '';
    let gamesList = [];
    let currentGame = null;

    function loginUser() {
      const val = document.getElementById('userIdInput').value.trim();
      if (!val) return alert('請輸入有效的代號！');
      currentUserId = val;
      document.getElementById('currentUserIdDisplay').innerText = currentUserId;
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('gameContainer').classList.remove('hidden');
      fetchUserData();
    }

    function logoutUser() {
      currentUserId = '';
      gamesList = [];
      currentGame = null;
      document.getElementById('loginCard').classList.remove('hidden');
      document.getElementById('gameContainer').classList.add('hidden');
    }

    function fetchUserData() {
      setSaveStatus('讀取雲端資料中...', 'text-slate-400');
      google.script.run.withSuccessHandler(res => {
        if (res.success) {
          gamesList = res.games;
          setSaveStatus('已同步雲端', 'text-emerald-600');
          if (gamesList.length > 0) {
            // 優先選取最新的未完成局，否則選最後一局
            const unfinished = gamesList.slice().reverse().find(g => g.status === '未完成');
            selectGame(unfinished ? unfinished.gameId : gamesList[gamesList.length - 1].gameId);
          } else {
            renderHistory();
          }
        }
      }).loadUserData(currentUserId);
    }

    function handleCreateNewGame() {
      setSaveStatus('建立新局中...', 'text-amber-600');
      document.getElementById('newGameBtn').disabled = true;

      google.script.run.withSuccessHandler(res => {
        document.getElementById('newGameBtn').disabled = false;
        if (res.success) {
          gamesList.push(res.game);
          selectGame(res.game.gameId);
          setSaveStatus('新局已建立並寫入雲端', 'text-emerald-600');
        }
      }).createNewGame(currentUserId);
    }

    function selectGame(gameId) {
      currentGame = gamesList.find(g => g.gameId === gameId);
      renderCurrentGame();
      renderHistory();
    }

    function renderCurrentGame() {
      const input = document.getElementById('guessInput');
      const submit = document.getElementById('submitBtn');
      const title = document.getElementById('currentTurnTitle');
      const badge = document.getElementById('turnStatusBadge');

      if (!currentGame) return;

      title.innerText = `第 ${currentGame.gameNum} 局`;
      updateDebugDisplay();

      if (currentGame.status === '已猜對') {
        badge.className = 'text-xs px-2.5 py-1 rounded-full font-semibold bg-emerald-100 text-emerald-700';
        badge.innerText = '已猜對 (完成)';
        input.disabled = true;
        submit.disabled = true;
      } else {
        badge.className = 'text-xs px-2.5 py-1 rounded-full font-semibold bg-blue-100 text-blue-700';
        badge.innerText = '未完成 (進行中)';
        input.disabled = false;
        submit.disabled = false;
      }
    }

    function handleGuessSubmit(e) {
      e.preventDefault();
      hideAlert();
      const input = document.getElementById('guessInput');
      const val = input.value.trim();

      if (!/^\d{4}$/.test(val) || new Set(val).size !== 4) {
        showAlert('請輸入 4 個不重複的數字！');
        return;
      }

      setSaveStatus('正在判定並儲存至雲端...', 'text-amber-600');
      input.disabled = true;
      document.getElementById('submitBtn').disabled = true;

      google.script.run.withSuccessHandler(res => {
        input.disabled = (currentGame.status === '已猜對');
        document.getElementById('submitBtn').disabled = (currentGame.status === '已猜對');
        
        if (res.success) {
          // 更新記憶體中資料
          const idx = gamesList.findIndex(g => g.gameId === res.game.gameId);
          gamesList[idx] = res.game;
          currentGame = res.game;
          input.value = '';
          setSaveStatus('已儲存', 'text-emerald-600');
          renderCurrentGame();
          renderHistory();
        } else {
          showAlert(res.message);
          setSaveStatus('儲存失敗', 'text-red-600');
        }
      }).submitGuess(currentUserId, currentGame.gameId, val);
    }

    function renderHistory() {
      const container = document.getElementById('historyContainer');
      container.innerHTML = '';

      [...gamesList].reverse().forEach(g => {
        const isSelected = currentGame && currentGame.gameId === g.gameId;
        const div = document.createElement('div');
        div.className = `p-4 border rounded-lg ${isSelected ? 'border-indigo-500 bg-indigo-50/30' : 'border-slate-200 bg-white'}`;

        let rows = g.guesses.map(gu => `
          <tr class="border-b text-sm font-mono">
            <td class="py-1 px-2 text-slate-400">#${gu.step}</td>
            <td class="py-1 px-2 font-bold">${gu.guessStr}</td>
            <td class="py-1 px-2 text-indigo-600">${gu.resultStr}</td>
          </tr>
        `).join('');

        div.innerHTML = `
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold">第 ${g.gameNum} 局 (${g.status})</span>
            ${g.status === '未完成' && !isSelected ? `<button onclick="selectGame('${g.gameId}')" class="text-xs bg-indigo-600 text-white px-3 py-1 rounded">繼續這一局</button>` : ''}
          </div>
          ${g.guesses.length > 0 ? `<table class="w-full text-left"><tbody>${rows}</tbody></table>` : '<p class="text-xs text-slate-400">無猜測紀錄</p>'}
        `;
        container.appendChild(div);
      });
    }

    function toggleDebugMode() {
      const show = document.getElementById('debugToggle').checked;
      document.getElementById('debugPanel').classList.toggle('hidden', !show);
      updateDebugDisplay();
    }

    function updateDebugDisplay() {
      if (currentGame) {
        document.getElementById('debugAnswer').innerText = currentGame.answer;
      }
    }

    function setSaveStatus(msg, colorClass) {
      const el = document.getElementById('saveStatus');
      el.className = `text-xs font-semibold ${colorClass}`;
      el.innerText = msg;
    }

    function showAlert(msg) {
      const box = document.getElementById('alertBox');
      box.innerText = msg;
      box.classList.remove('hidden');
    }

    function hideAlert() {
      document.getElementById('alertBox').classList.add('hidden');
    }
  </script>
</body>
</html>
