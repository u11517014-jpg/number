<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極猜數字遊戲（含歷史紀錄）</title>
    <style>
        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 14px;
        }

        .input-group {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        input[type="number"] {
            width: 120px;
            padding: 10px;
            font-size: 18px;
            border: 2px solid #ccc;
            border-radius: 6px;
            text-align: center;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: #007bff;
        }

        button {
            padding: 10px 16px;
            font-size: 15px;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .restart-btn {
            background-color: #28a745;
            display: none;
            margin: 15px auto 0;
        }

        .restart-btn:hover {
            background-color: #218838;
        }

        .clear-btn {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 12px;
            margin-top: 10px;
        }

        .clear-btn:hover {
            background-color: #c82333;
        }

        .message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 27px;
        }

        .too-high { color: #dc3545; }
        .too-low { color: #ffc107; }
        .correct { color: #28a745; }

        .current-attempts {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

        hr {
            border: 0;
            height: 1px;
            background: #eee;
            margin: 20px 0;
        }

        .history-section {
            text-align: left;
        }

        .history-section h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-list {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 8px 12px;
            background: #fafafa;
            font-size: 14px;
        }

        .history-item {
            padding: 4px 0;
            border-bottom: 1px dashed #e0e0e0;
            color: #555;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .empty-history {
            color: #aaa;
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>猜數字遊戲</h1>
        <p>系統已隨機產生 1 ~ 100 之間的數字，請猜猜看！</p>

        <div class="input-group">
            <input type="number" id="guessInput" min="1" max="100" placeholder="1-100">
            <button onclick="checkGuess()" id="submitBtn">猜！</button>
        </div>

        <div id="message" class="message"></div>
        <button onclick="initGame()" id="restartBtn" class="restart-btn">再玩一次</button>
        
        <div id="currentAttempts" class="current-attempts">本局已猜：0 次</div>

        <hr>

        <div class="history-section">
            <h3>
                <span>🏆 歷史對戰紀錄</span>
                <button onclick="clearHistory()" class="clear-btn">清除紀錄</button>
            </h3>
            <div id="historyList" class="history-list">
                <!-- 歷史紀錄會自動載入到這裡 -->
            </div>
        </div>
    </div>

    <script>
        let targetNumber;
        let attempts = 0;
        let gameCount = 0;

        // 頁面載入時先渲染歷史紀錄
        window.onload = function() {
            renderHistory();
            initGame();
        };

        // 初始化遊戲
        function initGame() {
            targetNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            
            document.getElementById('guessInput').value = '';
            document.getElementById('guessInput').disabled = false;
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('message').textContent = '';
            document.getElementById('message').className = 'message';
            document.getElementById('restartBtn').style.display = 'none';
            document.getElementById('currentAttempts').textContent = '本局已猜：0 次';
        }

        // 檢查玩家輸入的數字
        function checkGuess() {
            const inputElement = document.getElementById('guessInput');
            const messageElement = document.getElementById('message');
            const currentAttemptsElement = document.getElementById('currentAttempts');
            const userGuess = parseInt(inputElement.value);

            // 驗證輸入
            if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
                messageElement.textContent = '請輸入 1 到 100 之間的有效數字！';
                messageElement.className = 'message too-high';
                return;
            }

            attempts++;
            currentAttemptsElement.textContent = `本局已猜：${attempts} 次`;

            // 比對數字
            if (userGuess === targetNumber) {
                messageElement.textContent = `🎉 恭喜你猜對了！答案就是 ${targetNumber}！`;
                messageElement.className = 'message correct';
                
                // 結束遊戲狀態
                inputElement.disabled = true;
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('restartBtn').style.display = 'block';

                // 保存歷史紀錄
                saveHistory(targetNumber, attempts);
                renderHistory();
            } else if (userGuess > targetNumber) {
                messageElement.textContent = '📈 太大了！再小一點。';
                messageElement.className = 'message too-high';
            } else {
                messageElement.textContent = '📉 太小了！再大一點。';
                messageElement.className = 'message too-low';
            }

            // 清空輸入框並聚焦
            inputElement.value = '';
            inputElement.focus();
        }

        // 儲存紀錄到 localStorage
        function saveHistory(ans, totalAttempts) {
            let history = JSON.parse(localStorage.getItem('guessNumberHistory')) || [];
            const newRecord = {
                id: Date.now(),
                date: new Date().toLocaleString('zh-TW', { hour12: false }),
                answer: ans,
                attempts: totalAttempts
            };
            history.unshift(newRecord); // 最新紀錄排在最前面
            localStorage.setItem('guessNumberHistory', JSON.stringify(history));
        }

        // 渲染歷史紀錄
        function renderHistory() {
            const historyList = document.getElementById('historyList');
            let history = JSON.parse(localStorage.getItem('guessNumberHistory')) || [];

            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-history">尚無戰績紀錄</div>';
                return;
            }

            historyList.innerHTML = history.map((item, index) => `
                <div class="history-item">
                    <strong>第 ${history.length - index} 局</strong> [${item.date}]<br>
                    答案：<strong>${item.answer}</strong> | 總共猜了：<strong>${item.attempts}</strong> 次
                </div>
            `).join('');
        }

        // 清除歷史紀錄
        function clearHistory() {
            if (confirm('確定要清除所有過去的遊戲紀錄嗎？')) {
                localStorage.removeItem('guessNumberHistory');
                renderHistory();
            }
        }

        // 支援按下 Enter 鍵送出
        document.getElementById('guessInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                checkGuess();
            }
        });
    </script>
</body>
</html>
