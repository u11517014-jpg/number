<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極猜數字遊戲</title>
    <style>
        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 14px;
        }

        .input-group {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        input[type="number"] {
            width: 120px;
            padding: 10px;
            font-size: 18px;
            border: 2px solid #ccc;
            border-radius: 6px;
            text-align: center;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: #007bff;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .restart-btn {
            background-color: #28a745;
            display: none;
            margin: 15px auto 0;
        }

        .restart-btn:hover {
            background-color: #218838;
        }

        .message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 27px;
        }

        .too-high {
            color: #dc3545;
        }

        .too-low {
            color: #ffc107;
        }

        .correct {
            color: #28a745;
        }

        .history {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>猜數字遊戲</h1>
        <p>系統已隨機產生 1 ~ 100 之間的數字，請猜猜看！</p>

        <div class="input-group">
            <input type="number" id="guessInput" min="1" max="100" placeholder="1-100">
            <button onclick="checkGuess()" id="submitBtn">猜！</button>
        </div>

        <div id="message" class="message"></div>
        <button onclick="initGame()" id="restartBtn" class="restart-btn">再玩一次</button>
        
        <div id="history" class="history">已猜次數：0 次</div>
    </div>

    <script>
        let targetNumber;
        let attempts = 0;

        // 初始化遊戲
        function initGame() {
            targetNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            
            document.getElementById('guessInput').value = '';
            document.getElementById('guessInput').disabled = false;
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('message').textContent = '';
            document.getElementById('message').className = 'message';
            document.getElementById('restartBtn').style.display = 'none';
            document.getElementById('history').textContent = '已猜次數：0 次';
        }

        // 檢查玩家輸入的數字
        function checkGuess() {
            const inputElement = document.getElementById('guessInput');
            const messageElement = document.getElementById('message');
            const historyElement = document.getElementById('history');
            const userGuess = parseInt(inputElement.value);

            // 驗證輸入
            if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
                messageElement.textContent = '請輸入 1 到 100 之間的有效數字！';
                messageElement.className = 'message too-high';
                return;
            }

            attempts++;
            historyElement.textContent = `已猜次數：${attempts} 次`;

            // 比對數字
            if (userGuess === targetNumber) {
                messageElement.textContent = `🎉 恭喜你猜對了！答案就是 ${targetNumber}！`;
                messageElement.className = 'message correct';
                
                // 結束遊戲狀態
                inputElement.disabled = true;
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('restartBtn').style.display = 'block';
            } else if (userGuess > targetNumber) {
                messageElement.textContent = '📈 太大了！再小一點。';
                messageElement.className = 'message too-high';
            } else {
                messageElement.textContent = '📉 太小了！再大一點。';
                messageElement.className = 'message too-low';
            }

            // 清空輸入框並聚焦
            inputElement.value = '';
            inputElement.focus();
        }

        // 支援按下 Enter 鍵送出
        document.getElementById('guessInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                checkGuess();
            }
        });

        // 頁面載入後自動開啟新遊戲
        initGame();
    </script>
</body>
</html>
